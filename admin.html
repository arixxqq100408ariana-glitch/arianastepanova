<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Выпечка с любовью - Админ панель</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-container">
        <header>
            <a href="index.html" class="logo-link" style="text-decoration: none;">
                <div class="logo">
                    <h1>Выпечка с любовью</h1>
                    <p>АДМИН ПАНЕЛЬ</p>
                </div>
            </a>
            <div class="header-right">
              <a href="cart.html" class="cart-icon-header">
    <i class="fas fa-shopping-cart"></i>
    <span class="cart-count" id="cart-count">0</span>
</a>
                <div class="burger-menu">☰</div>
            </div>
        </header>

        <nav class="mobile-nav">
            <a href="index.html">ГЛАВНАЯ</a>
            <a href="catalog.html">КАТАЛОГ</a>
            <a href="about.html">О НАС</a>
            <a href="account.html">ВХОД / РЕГИСТРАЦИЯ</a>
        </nav>

        <main>
            <h2 class="page-title">Админ-панель</h2>

            <div id="admin-login-section" class="admin-login-section">
                <div class="admin-login-card">
                    <h3>Вход в админ-панель</h3>
                    <p class="admin-hint">Логин: admin | Пароль: admin123</p>
                    <div class="form-group">
                        <input type="text" id="admin-login" placeholder="Логин" class="admin-input">
                    </div>
                    <div class="form-group">
                        <input type="password" id="admin-password" placeholder="Пароль" class="admin-input">
                    </div>
                    <button id="admin-login-btn" class="admin-login-btn">Войти как администратор</button>
                </div>
            </div>

            <div id="admin-panel" style="display: none;">
                <div class="admin-stats">
                    <div class="admin-stat-card">
                        <span class="admin-stat-icon">📦</span>
                        <span class="admin-stat-number" id="total-products">0</span>
                        <span class="admin-stat-label">товаров</span>
                    </div>
                    <div class="admin-stat-card">
                        <span class="admin-stat-icon">👤</span>
                        <span class="admin-stat-number" id="total-users">0</span>
                        <span class="admin-stat-label">пользователей</span>
                    </div>
                    <div class="admin-stat-card">
                        <span class="admin-stat-icon">📋</span>
                        <span class="admin-stat-number" id="total-orders">0</span>
                        <span class="admin-stat-label">заказов</span>
                    </div>
                </div>

                <div class="admin-tabs">
                    <button class="admin-tab active" data-tab="products">Товары</button>
                    <button class="admin-tab" data-tab="add">Добавить</button>
                    <button class="admin-tab" data-tab="users">Пользователи</button>
                    <button class="admin-tab" data-tab="orders">Заказы</button>
                </div>

                <div id="tab-products" class="admin-tab-content active">
                    <div class="admin-search">
                        <input type="text" id="search-products" placeholder="Поиск товаров..." class="admin-search-input">
                    </div>
                    <div id="admin-products-list" class="admin-products-list"></div>
                </div>

                <div id="tab-add" class="admin-tab-content">
                    <form id="add-product-form" class="admin-add-form">
                        <div class="admin-form-row">
                            <div class="admin-form-group">
                                <label>Название товара</label>
                                <input type="text" id="new-title" placeholder="Например: Торт Медовик" required>
                            </div>
                            <div class="admin-form-group">
                                <label>Цена (₽)</label>
                                <input type="number" id="new-price" placeholder="Например: 1200" required>
                            </div>
                        </div>
                        <div class="admin-form-row">
                            <div class="admin-form-group">
                                <label>Вес</label>
                                <input type="text" id="new-weight" placeholder="Например: 1 кг">
                            </div>
                            <div class="admin-form-group">
                                <label>Категория</label>
                                <select id="new-category">
                                    <option value="cake">Торт</option>
                                    <option value="dessert">Десерт</option>
                                    <option value="pastry">Пирожное</option>
                                    <option value="cookies">Печенье</option>
                                </select>
                            </div>
                        </div>
                        <div class="admin-form-group">
                            <label>Состав</label>
                            <textarea id="new-ingredients" placeholder="Например: Мука, яйца, масло, мёд..." rows="2"></textarea>
                        </div>
                        <div class="admin-form-group">
                            <label>Подробное описание</label>
                            <textarea id="new-desc" placeholder="Описание товара..." rows="3" required></textarea>
                        </div>
                        <div class="admin-form-group">
                            <label>Ссылка на фото</label>
                            <input type="text" id="new-image" placeholder="https://...">
                        </div>
                        <button type="submit" class="admin-submit-btn">Добавить товар</button>
                    </form>
                </div>

                <div id="tab-users" class="admin-tab-content">
                    <div id="admin-users-list" class="admin-users-list"></div>
                </div>

                <div id="tab-orders" class="admin-tab-content">
                    <div id="admin-orders-list" class="admin-orders-list"></div>
                </div>

                <button id="admin-logout-btn" class="admin-logout-btn">Выйти из админки</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
